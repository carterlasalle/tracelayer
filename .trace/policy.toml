# TraceLayer policy (spec Section 24.4).
profile = "standard"

[lifecycle]
default = "wip"
ci = "merge"

[requirements.merge]
require_work_ancestry = true
require_requirement_for_changed_behavior = true
require_verifying_test = true
require_test_pass = true
require_coverage_confirmation = false
block_stale = true

[requirements.release]
require_coverage_confirmation = true
require_semantic_audit = true

[exclusions]
paths = [
  "vendor/**",
  "generated/**",
  "docs/vendor/**",
  ".trace/**",
  "tests/**/__init__.py",
  ".github/**",
  "contrib/**",
  "scripts/**",
  ".gitignore",
  "AGENTS.md",
  "CLAUDE.md",
  "pyproject.toml",
  "uv.lock",
  "src/tracelayer/__init__.py",
  "adapters/**/package.json",
  ".mcp.json",
  "junit.xml",
  "coverage.xml",
  ".claude/**",
  ".pi/**",
  ".omp/**",
  ".hermes/**",
  ".agents/**",
  "opencode.json",
  "src/tracelayer/web/vendor/**",
  "docs/marker-protocol.md",
  "docs/relationships.md",
  "skills/traceability/references/marker-protocol.md",
  "adapters/claude-code/settings.template.json"
]
