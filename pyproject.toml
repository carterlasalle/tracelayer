[project]
name = "tracelayer"
version = "0.2.28"
description = "TraceLayer: agent-native software traceability system"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "carterlasalle" }]
keywords = [
    "traceability",
    "requirements",
    "software-engineering",
    "agents",
    "ci",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.3",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/carterlasalle/tracelayer"
Repository = "https://github.com/carterlasalle/tracelayer"
Issues = "https://github.com/carterlasalle/tracelayer/issues"
Documentation = "https://github.com/carterlasalle/tracelayer#documentation"

[project.scripts]
trace = "tracelayer.cli:main"
tracelayer = "tracelayer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelayer"]

[tool.hatch.build.targets.wheel.force-include]
"skills/traceability" = "tracelayer/_skills/traceability"
"adapters" = "tracelayer/_adapters"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/skills",
    "/adapters",
    "/docs",
    "/tests",
    "/scripts",
    "/README.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
    "/AGENTS.md",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.6",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pip-audit>=2.10.1",
    "vulture>=2.16",
    "bandit>=1.9.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/tracelayer/cli.py" = ["B008"]
