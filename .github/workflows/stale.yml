# Close stale issues and PRs (actions/stale).
name: Stale

on:
  schedule:
    - cron: "0 3 * * *" # nightly UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 90
          days-before-close: 30
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "dependencies,security,enhancement"
          exempt-pr-labels: "dependencies,security,enhancement"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed in 30 days if no
            further activity occurs. Thank you for your contribution.
          stale-pr-message: >
            This pull request has been automatically marked as stale because
            it has not had recent activity. It will be closed in 30 days if no
            further activity occurs.
          close-issue-message: >
            This issue was closed automatically because it has been stale for
            30 days with no activity.
          close-pr-message: >
            This pull request was closed automatically because it has been
            stale for 30 days with no activity.
