# Static analysis, dead-code, security, and dependency-vulnerability gates.
name: Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Dead code (vulture)
        run: uv run vulture src vulture_whitelist.py --min-confidence 80

      - name: Security lint (bandit)
        run: uv run bandit -c bandit.yaml -r src -q

      - name: Dependency vulnerabilities (pip-audit)
        run: uv run pip-audit
