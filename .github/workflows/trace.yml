name: Trace Integrity

on:
  pull_request:
  push:
    branches: [master]

jobs:
  trace:
    runs-on: ubuntu-latest
    # Fork safety (spec 26.1): trace commands never receive write tokens.
    # Core validation and evidence ingestion run with the default GITHUB_TOKEN
    # (read-only) and no other secrets. External mirror writes happen only in
    # a separate trusted/privileged workflow after merge.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pin the exact uv version for reproducibility; bump deliberately.
          version: "0.5.x"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Deterministic trace validation
        run: uv run trace verify --changed --lifecycle merge

      - name: Test with machine-readable results and coverage
        run: ./scripts/test-with-trace-evidence.sh

      - name: Ingest evidence
        run: |
          uv run trace evidence ingest \
            --junit junit.xml \
            --coverage coverage.xml \
            --revision "$GITHUB_SHA"

      - name: Evidence-aware trace validation
        run: uv run trace verify --changed --lifecycle merge --require-evidence

      - name: Generate PR trace summary
        if: github.event_name == 'pull_request'
        run: uv run trace report pr --output trace-summary.md

      - name: Upload PR trace summary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trace-summary
          path: trace-summary.md
          if-no-files-found: ignore
