# Dependabot version updates.
#
# package-ecosystem "pip" tracks the dependencies declared in pyproject.toml.
# Note: Dependabot cannot update uv.lock — after merging a dependency bump,
# run `uv lock` (or let CI's `uv sync --frozen` flag the drift).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # Python 3.12+ runtime; never bump below the floor.
      - dependency-name: "tree-sitter"
        versions: ["<0.23"]
